<header
  class="flex justify-between items-center px-6 py-4 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 transition-colors"
>
  <div class="flex items-center gap-4">
    <button
      class="text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300 cursor-pointer p-1.5 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        ></path>
      </svg>
    </button>
    <div>
      <h1 class="text-xl font-extrabold text-slate-900 dark:text-white leading-tight">Dashboard</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">Welcome back, Admin</p>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <button
      (click)="toggleDarkMode()"
      class="w-10 h-10 flex items-center justify-center rounded-xl border transition-all cursor-pointer shadow-sm"
      [ngClass]="
        isDarkMode
          ? 'bg-[#6b4eff] border-[#6b4eff] text-white'
          : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-400'
      "
    >
      @if (isDarkMode) {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
          ></path>
        </svg>
      } @else {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
          ></path>
        </svg>
      }
    </button>
    <button
      class="relative w-10 h-10 flex items-center justify-center rounded-xl border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors cursor-pointer shadow-sm"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
        ></path>
      </svg>

      <span
        class="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[10px] font-bold text-white ring-2 ring-white dark:ring-slate-900"
      >
        4
      </span>
    </button>
    <div
      class="flex items-center gap-3 border border-slate-200 dark:border-slate-700 rounded-xl p-1 pr-3 bg-white dark:bg-slate-800 cursor-pointer shadow-sm"
    >
      <div
        class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-pink-500 text-white flex items-center justify-center text-xs font-bold"
      >
        AD
      </div>
      <div class="hidden sm:block">
        <p class="text-sm font-bold text-slate-900 dark:text-white leading-none mb-1">Admin User</p>
        <p
          class="text-[10px] text-slate-400 dark:text-slate-500 leading-none uppercase tracking-wide font-semibold"
        >
          Super Admin
        </p>
      </div>
    </div>
  </div>
</header>
