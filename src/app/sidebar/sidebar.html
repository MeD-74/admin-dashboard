<div
  class="flex flex-col h-full bg-[#161622] text-gray-400 py-6 border-r border-white/5 transition-all"
>
  <div class="flex items-center gap-3 px-6 mb-10">
    <div class="bg-[#6b4eff] text-white p-2.5 rounded-xl shadow-lg shadow-[#6b4eff]/30">
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
        <path
          d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
          clip-rule="evenodd"
          fill-rule="evenodd"
        ></path>
      </svg>
    </div>
    <div>
      <h1 class="text-white font-bold text-xl leading-tight tracking-tight">EmpManager</h1>
      <p class="text-[10px] uppercase tracking-[0.2em] text-gray-500 font-bold">Admin Portal</p>
    </div>
  </div>

  <div class="flex-1 px-4 space-y-1.5">
    <p class="text-[11px] font-bold text-gray-600 mb-4 px-3 uppercase tracking-widest">Main Menu</p>

    <a
      routerLink="/dashboard"
      routerLinkActive="bg-[#232336] text-white border-l-4 border-[#6b4eff]"
      class="flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all hover:bg-[#232336]/50 hover:text-gray-200 group"
    >
      <svg class="w-5 h-5 text-[#6b4eff]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
        ></path>
      </svg>
      <span class="font-semibold text-sm">Dashboard</span>
    </a>

    <a
      routerLink="/employees"
      routerLinkActive="bg-[#232336] text-white border-l-4 border-[#6b4eff]"
      class="flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all hover:bg-[#232336]/50 hover:text-gray-200 group"
    >
      <svg
        class="w-5 h-5 text-gray-500 group-hover:text-[#6b4eff]"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
        ></path>
      </svg>
      <span class="font-semibold text-sm">Employees</span>
      <span
        class="ml-auto bg-[#6b4eff]/20 text-[#6b4eff] text-[10px] font-bold px-2 py-0.5 rounded-full"
        >23</span
      >
    </a>

    <a
      routerLink="/add-employee"
      routerLinkActive="bg-[#232336] text-white border-l-4 border-[#6b4eff]"
      class="flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all hover:bg-[#232336]/50 hover:text-gray-200 group"
    >
      <svg
        class="w-5 h-5 text-gray-500 group-hover:text-[#6b4eff]"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"
        ></path>
      </svg>
      <span class="font-semibold text-sm">Add Employee</span>
    </a>

    <a
      routerLink="/settings"
      routerLinkActive="bg-[#232336] text-white border-l-4 border-[#6b4eff]"
      class="flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all hover:bg-[#232336]/50 hover:text-gray-200 group"
    >
      <svg
        class="w-5 h-5 text-gray-500 group-hover:text-[#6b4eff]"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
        ></path>
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
        ></path>
      </svg>
      <span class="font-semibold text-sm">Settings</span>
    </a>
  </div>

  <div class="px-4 mt-auto">
    <div
      (click)="onSignOut()"
      class="flex items-center justify-between hover:bg-red-500/10 p-3 rounded-xl cursor-pointer transition-all group"
    >
      <div class="flex items-center gap-3">
        <div
          class="bg-purple-500 text-white w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm shadow-md"
        >
          AD
        </div>
        <div>
          <p class="text-white font-medium text-sm leading-tight">Admin User</p>
          <p class="text-[11px] text-gray-500 group-hover:text-red-400">Sign Out</p>
        </div>
      </div>

      <svg
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        class="w-5 h-5 text-gray-500 group-hover:text-red-500 transition-colors"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
        ></path>
      </svg>
    </div>
  </div>
</div>
